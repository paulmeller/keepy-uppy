name: Keepy Uppy
options:
  createIntermediateGroups: true
targets:
  Keepy Uppy:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources
      - Shared
      - path: Agent/ConditionObservers.swift
      - path: Agent/EvidenceLoop.swift
      - Resources/Assets.xcassets
      - path: Launchd/au.com.workwireless.keepy-uppy.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      - path: Launchd/au.com.workwireless.keepy-uppy.agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - target: KeepyUppyHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: keepy-uppy
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: KeepyUppyAgent
        embed: true
        codeSign: true
        copy:
          destination: executables
      - sdk: IOKit.framework
      # This target compiles Agent/ConditionObservers.swift (see `sources`
      # above), so it links whatever that file imports — even though the app
      # itself never runs an observer. SystemConfiguration arrived with
      # SystemVPNObserver. Leaving it off only this target produces a link
      # error in the *app*, which is a confusing place to look for a change
      # made to the agent's code.
      - sdk: SystemConfiguration.framework
      # THIS TARGET ONLY. The app holds the notification centre because it has
      # the UI that can ask for the grant, the run loop that can present, and a
      # lifetime the user understands; the agent would be a *second*,
      # separately-refusable notification client (its bundle identifier is its
      # own — `au.com.workwireless.keepy-uppy.agent` — even though it lives
      # inside this bundle), and the daemon and CLI have no business with one at
      # all. Unlike SystemConfiguration above there is no shared file forcing
      # this onto a second target: nothing outside `Sources/` imports
      # UserNotifications.
      - sdk: UserNotifications.framework
      # THIS TARGET ONLY, and it is the one framework here that would be
      # actively wrong anywhere else. Global hot keys are `RegisterEventHotKey`
      # (spec §4 chose it over an event tap because it needs no Accessibility
      # grant), which lives in Carbon's HIToolbox — and a keyboard shortcut is
      # meaningless to the root daemon, the CLI and the agent, none of which has
      # a keyboard or a run loop that receives one. `Sources/HotKey.swift` and
      # `Sources/HotKeyCenter.swift` are therefore in `Sources/` rather than
      # `Shared/`: putting them in `Shared/` is what would drag this framework
      # onto the other three targets.
      - sdk: Carbon.framework
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: au.com.workwireless.keepy-uppy
        PRODUCT_MODULE_NAME: KeepyUppy
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "7"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Shared/PowerSPI.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Keepy UppyTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests
    dependencies:
      - target: Keepy Uppy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  KeepyUppyHelper:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources: [Helper, Shared]
    dependencies:
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.workwireless.keepy-uppy.helper
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "7"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Shared/PowerSPI.h
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # This target must never install standalone at its default
        # /usr/local/bin path during an archive — it should only ever exist
        # embedded inside Keepy Uppy.app (via the app target's `dependencies:
        # embed: true`). Without this, xcodebuild archive additionally
        # installs it as a top-level Products/usr/local/bin/ item, which
        # makes Xcode's distribution-method manager stop recognizing the
        # archive as a clean single-app archive at all — every app-specific
        # distribution method (including Developer ID) gets silently
        # rejected in favor of generic fallbacks, with no useful error until
        # export time.
        SKIP_INSTALL: YES

  keepy-uppy:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources: [CLI, Shared]
    dependencies:
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.workwireless.keepy-uppy.cli
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "7"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Shared/PowerSPI.h
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # See the matching comment on KeepyUppyHelper above — same reason.
        SKIP_INSTALL: YES

  KeepyUppyAgent:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources: [Agent, Shared]
    dependencies:
      - sdk: AppKit.framework
      - sdk: CoreGraphics.framework
      - sdk: IOKit.framework
      # See the matching entry on the `Keepy Uppy` target: the observers
      # compile into both, so a framework they import belongs on both.
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.workwireless.keepy-uppy.agent
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "7"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Shared/PowerSPI.h
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # See project.yml's KeepyUppyHelper/keepy-uppy for why this is
        # mandatory, not optional: without it this target additionally
        # installs standalone at /usr/local/bin during archiving, which
        # breaks `xcodebuild -exportArchive` for the whole app in a way
        # that produces no useful error message.
        SKIP_INSTALL: YES
schemes:
  Keepy Uppy:
    build:
      targets:
        Keepy Uppy: all
        Keepy UppyTests: [test]
    run:
      config: Debug
    test:
      targets:
        - Keepy UppyTests
    archive:
      config: Release
